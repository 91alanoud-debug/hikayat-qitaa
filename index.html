<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101b24"><title>حكاية قطعة | متحف إسلامي تفاعلي</title><meta name="description" content="تجوّل في متحف ثلاثي الأبعاد واكتشف حكايات عشرين قطعة بالعربية والإنجليزية والأوردية."><link rel="stylesheet" href="style.css"></head><body>
<canvas id="world" aria-label="قاعة المتحف ثلاثية الأبعاد"></canvas>
<div class="vignette"></div><header><div class="brand"><span class="brandmark">۞</span><div><strong id="brand">حكاية قطعة</strong><small id="subtitle">المتحف الإسلامي التفاعلي</small></div></div><div class="topactions"><button id="help" aria-label="تعليمات">?</button><select id="language" aria-label="Language"><option value="ar">العربية</option><option value="en">English</option><option value="ur">اردو</option></select><button id="full" aria-label="Fullscreen">⛶</button></div></header>
<section class="roomlabel"><span id="eyebrow">القاعة الكبرى · ٢٠ قطعة</span><h1 id="roomtitle">أشياء صغيرة.<br>حكايات باقية.</h1><p id="roomhint">اسحبي للنظر حولك · تحركي نحو القطع لاستكشافها</p></section>
<div id="target" hidden><button id="inspect"></button></div><div id="crosshair">+</div>
<nav class="walk" aria-label="Movement"><button data-move="forward" aria-label="Forward">↑</button><div><button data-move="left" aria-label="Left">←</button><button data-move="back" aria-label="Back">↓</button><button data-move="right" aria-label="Right">→</button></div></nav>
<div class="location"><span id="positionlabel">المدخل</span><div class="minimap"><span id="mapdot"></span></div><button id="home">العودة للمدخل</button></div>
<footer><div class="footerhead"><span id="collectionlabel">مقتنيات المتحف</span><span id="count">٢٠ قطعة · نماذج تعليمية</span><button id="togglelist">عرض المجموعة ↑</button></div><div id="strip"></div></footer>
<dialog id="detail"><button class="close" id="close" aria-label="Close">×</button><div class="detailvisual"><div id="artifactImage"></div><span id="replica"></span><span id="objectnumber"></span></div><div class="detailbody"><div id="objectcategory"></div><h2 id="objectname"></h2><p id="objectsummary"></p><nav class="tabs"><button data-tab="story" class="active"></button><button data-tab="origin"></button><button data-tab="meaning"></button></nav><h3 id="sectiontitle"></h3><p id="sectiontext"></p><div class="question"><span id="questionlabel"></span><p id="questiontext"></p><button id="answerToggle"></button><p id="answer" hidden></p></div><div id="sourcebox"></div><div class="detailactions"><button id="listen"></button><button id="visit"></button></div><p class="reviewnote" id="reviewnote"></p></div><div class="detailnav"><button id="previous">←</button><span id="detailcounter"></span><button id="next">→</button></div></dialog>
<dialog id="instructions"><button class="close" id="closehelp">×</button><span class="introicon">۞</span><h2 id="helptitle"></h2><p id="helpbody"></p><div id="helpkeys"></div><p id="helpnote"></p><button class="primary" id="enter"></button></dialog><div id="toast" role="status"></div><script type="module" src="app.js"></script></body></html>
